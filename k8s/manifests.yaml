apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-dashboard
  labels:
    app: portfolio-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-dashboard
  template:
    metadata:
      labels:
        app: portfolio-dashboard
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: dashboard
        image: ghcr.io/junatheslug/noaa-fisheries-dashboard:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-dashboard
spec:
  selector:
    app: portfolio-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
